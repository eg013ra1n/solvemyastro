[package]
name = "solvemyastro"
version = "0.2.0"
edition = "2021"
authors = ["Vilen Sharifov <vilen.sharifov@gmail.com>"]
description = "Standalone astrometric plate solver — precise WCS with SIP distortion. Rust lib + CLI."
license = "Apache-2.0"
repository = "https://github.com/eg013ra1n/solvemyastro"
readme = "README.md"
keywords = ["astronomy", "astrometry", "plate-solving", "wcs", "astrophotography"]
categories = ["science", "command-line-utilities"]

[lib]
name = "solvemyastro"
path = "src/lib.rs"

[[bin]]
name = "solvemyastro"
path = "src/main.rs"

[dependencies]
# FITS/XISF decode + raw star detection (ImageAnalyzer). solvemyastro adds
# its own star *selection* (SNR gate + SNR-rank, capped pool) on top;
# detection stays in rustafits (dual-use). Crate package = `rustafits`,
# lib = `astroimage`.
# Versions pinned to the workspace lock to avoid duplicate crate versions
# (project rule). CLI uses std::env::args (project convention — no clap).
rustafits = { path = "../rustafits" }
nalgebra = "0.35"
rayon = "1.10"
anyhow = "1"
memmap2 = "0.9"
cdshealpix = "0.9"
byteorder = "1"
# PROSAC RANSAC deterministic RNG (Phase 3). Seeded from SolveConfig::ransac_seed
# so the corpus gate produces identical results across repeated runs.
rand = "0.10"
rand_xoshiro = "0.8"
# Structured-logging facade only (no subscriber here). solvemyastro is a
# library — events flow through whatever subscriber the embedding process
# installs (the athenaeum host subscriber when used as a workspace dep;
# emitted nowhere when run standalone with no subscriber installed, e.g.
# the `solvemyastro` CLI binary, which keeps its own println/eprintln).
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
# Machine-readable corpus-bench baseline (precision+speed regression gate).
# Pinned to the workspace version to avoid duplicate crate versions.
serde_json = "1"
